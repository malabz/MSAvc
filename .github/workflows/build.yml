name: Build and Upload to malab

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-64
          - os: macos-14
            target: osx-64
          - os: macos-14
            target: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: 'latest'
          channels: conda-forge,bioconda,nodefaults
          channel-priority: strict
          auto-activate: true

      - name: Install conda-build and anaconda-client
        run: |
          conda install -y -n base -c conda-forge conda-build anaconda-client
          conda list conda-build

      - name: Build package
        run: |
          conda build recipe/ --target-platform ${{ matrix.target }}

      - name: Upload to malab channel
        env:
          ANACONDA_API_TOKEN: ${{ secrets.MSAVC_CI }}
        run: |
          if [ -z "$ANACONDA_API_TOKEN" ]; then
            echo "ERROR: MSAVC_CI secret is empty!"
            exit 1
          fi
          PKG_PATH=$(conda build recipe/ --target-platform ${{ matrix.target }} --output | tail -n 1)
          echo "Uploading: $PKG_PATH"
          anaconda --token "$ANACONDA_API_TOKEN" upload \
              --channel malab \
              --label main \
              --force \
              "$PKG_PATH"