name: Build and Upload to malab

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: macos-13
            platform: osx-64
          - os: macos-14
            platform: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: 'latest'
          channels: conda-forge,bioconda
          channel-priority: strict
          auto-activate-base: false
          activate-environment: build-env

      - name: Install conda-build and anaconda-client
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge conda-build anaconda-client

      - name: Build package
        shell: bash -l {0}
        run: |
          conda build recipe/

      - name: Upload to malab channel
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda --token "$ANACONDA_API_TOKEN" upload \
              --channel malab \
              --force \
              $(conda build recipe/ --output)
