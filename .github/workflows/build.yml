name: Build and Upload to malab

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: macos-13
            platform: osx-64
          - os: macos-14
            platform: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: 'latest'
          channels: conda-forge,bioconda,nodefaults
          channel-priority: strict
          auto-activate: true

      - name: Install conda-build and anaconda-client
        run: |
          conda install -y -n base -c conda-forge conda-build anaconda-client

      - name: Build package
        run: |
          conda run -n base conda build recipe/

      - name: Upload to malab channel
        env:
          ANACONDA_API_TOKEN: ${{ secrets.MSAVC_CI }}
        run: |
          conda run -n base anaconda --token "$ANACONDA_API_TOKEN" upload \
              --channel malab \
              --label main \
              --force \
              $(conda run -n base conda build recipe/ --output)