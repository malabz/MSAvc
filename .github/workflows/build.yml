name: Build and Upload to malab

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-64
          - os: macos-13
            platform: osx-64
          - os: macos-14
            platform: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: 'latest'
          channels: conda-forge,bioconda,nodefaults
          channel-priority: strict
          auto-activate: true

      - name: Install conda-build and anaconda-client
        run: |
          conda install -y -n base -c conda-forge conda-build anaconda-client

      - name: Build package
        id: build
        run: |
          conda build recipe/
          PKG_PATH=$(conda build recipe/ --output | tail -n 1)
          echo "pkg_path=$PKG_PATH" >> "$GITHUB_OUTPUT"
          echo "Built package: $PKG_PATH"

      - name: Upload to malab channel
        env:
          ANACONDA_API_TOKEN: ${{ secrets.MSAVC_CI }}
        run: |
          if [ -z "$ANACONDA_API_TOKEN" ]; then
            echo "ERROR: MSAVC_CI secret is empty!"
            exit 1
          fi
          anaconda --token "$ANACONDA_API_TOKEN" upload \
              --user malab \
              --label main \
              --force \
              "${{ steps.build.outputs.pkg_path }}"