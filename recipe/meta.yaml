{% set name = "msavc" %}
{% set version = "0.1.20260925" %}
{% set git_tag = "0.1.20260925.2" %}       # ← 新增变量

package:
  name: {{ name }}
  version: {{ version }}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/malabz/MSAvc/archive/refs/tags/v{{ git_tag }}.tar.gz
  sha256: 8ab17683a3563d3264656168f586c4b215d2c0138300c460163baa0ca2b06a3c

build:
  number: 2

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
  host:
    - boost-cpp
    - htslib
    - zlib
    - libdeflate
    - bzip2
    - xz
    - libcurl
  run:
    - boost-cpp
    - htslib
    - zlib
    - libdeflate
    - bzip2
    - xz
    - libcurl
    - bash

test:
  commands:
    - msavc --version
    - msavc_fasta --version
    - msavc_genome --version

about:
  home: https://github.com/malabz/MSAvc
  license: MIT
  summary: 'MSAvc: variation calling for genome-scale multiple sequence alignments'
